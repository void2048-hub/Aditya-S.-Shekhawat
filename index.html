<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Full Name — AI Engineer</title>
<meta name="description" content="Portfolio of Your Full Name, AI Engineer and Full Stack Developer.">
<meta property="og:title" content="Your Full Name"><meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loader" role="status" aria-live="polite">
  <div class="logo"><i></i></div><div id="pct">0%</div><div id="log">Igniting engines</div>
</div>
<div id="orb" aria-hidden="true"><span></span></div>
<div id="bg" aria-hidden="true"></div>
<canvas id="space" aria-hidden="true"></canvas>
<div id="app">
  <nav id="nav" class="glass" aria-label="Primary"></nav>
  <main>
    <section id="top" class="hero">
      <div class="wrap">
        <p class="eyebrow">Mission Control · Online</p>
        <h1 class="glow" id="name"></h1>
        <div class="role" id="role" aria-live="off"></div>
        <div class="btns">
          <a class="btn primary mag" href="#projects">View Projects</a>
          <a class="btn mag" id="resume" href="#">Download Resume</a>
          <a class="btn mag" href="#contact">Contact Me</a>
        </div>
      </div>
    </section>
    <section id="about"><div class="wrap"><h2 class="glow">About</h2><div class="grid2" id="aboutBody"></div></div></section>
    <section id="skills"><div class="wrap"><h2 class="glow">Skills</h2><div id="planets"></div><div id="skillInfo" class="glass panel" aria-live="polite"></div></div></section>
    <section id="projects"><div class="wrap"><h2 class="glow">Projects</h2><div class="grid2" id="projBody"></div></div></section>
    <section id="experience"><div class="wrap"><h2 class="glow">Experience</h2><ol id="jobs"></ol></div></section>
    <section id="certifications"><div class="wrap"><h2 class="glow">Certifications</h2><div class="grid3" id="certs"></div></div></section>
    <section id="contact"><div class="wrap"><h2 class="glow">Mission Control</h2>
      <form id="form" class="glass panel">
        <label>Name<input name="name" required></label>
        <label>Email<input name="email" type="email" required></label>
        <label>Message<textarea name="message" rows="4" required></textarea></label>
        <button class="btn primary mag" type="submit"><span id="rocket" aria-hidden="true">🚀</span><span id="sendTxt">Launch Message</span></button>
      </form></div></section>
  </main>
  <footer><svg viewBox="0 0 400 80" aria-hidden="true"><polyline id="const" fill="none" stroke="currentColor" stroke-width="1"/></svg>
    <p id="quote"></p><div id="socials"></div><small id="copy"></small></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
<script src="script.js"></script>
</body>
</html>
